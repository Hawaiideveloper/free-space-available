[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-space-available"
version = "1.0.0"
description = "Smart disk cleanup for development machines, powered by corey-coder AI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "hawaiideveloper" }
]

dependencies = [
    "httpx>=0.24.0",
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
free-space = "src.corey_integration:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "mcp"]
